<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora POO</title>
  <style>
    table { border-collapse: collapse; margin: 20px auto; }
    td { border: 1px solid #333; padding: 15px; text-align: center; cursor: pointer; }
    .pantalla { background: #222; color: #0f0; font-size: 1.2em; text-align: right; padding: 10px; }
  </style>
</head>
<body>
  <table>
    <tr><td colspan="4" class="pantalla" id="pantalla">0</td></tr>
    <tr><td id="c">C</td><td id="borrar">←</td><td>.</td><td>/</td></tr>
    <tr><td>7</td><td>8</td><td>9</td><td>*</td></tr>
    <tr><td>4</td><td>5</td><td>6</td><td>-</td></tr>
    <tr><td>1</td><td>2</td><td>3</td><td>+</td></tr>
    <tr><td colspan="2">0</td><td>=</td><td></td></tr>
  </table>

  <script>
    // Clase Calculadora
    class Calculadora {
      constructor() {
        this.historial = [];
      }
      evaluar(expresion) {
        try {
          const r = eval(expresion);
          this.historial.push(r);
          return r;
        } catch {
          return "Error!";
        }
      }
      mostrarHistorial() {
        return this.historial;
      }
      sumar(a, b) {
        const r = a + b;
        this.historial.push(r);
        console.log(r);
        return r;
      }
      restar(a, b) {
        const r = a - b;
        this.historial.push(r);
        return r;
      }
      multiplicar(a, b) {
        const r = a * b;
        this.historial.push(r);
        return r;
      }
      dividir(a, b) {
        if (b === 0) {
          this.historial.push("Error: división por cero");
          return "Error";
        }
        const r = a / b;
        this.historial.push(r);
        return r;
      }
      ultimoResultado() {
        return this.historial[this.historial.length - 1];
      }
    }

    // Lógica de la interfaz
    const pantalla = document.getElementById("pantalla");
    let expresion = "";
    let nuevaOperacion = false;
    const calc = new Calculadora();

    document.querySelectorAll("td").forEach(celda => {
      celda.addEventListener("click", () => {
        const valor = celda.textContent.trim();

        if (celda.id === "c") {
          expresion = "";
          pantalla.textContent = "0";
          return;
        }

        if (celda.id === "borrar") {
          expresion = expresion.slice(0, -1);
          pantalla.textContent = expresion || "0";
          return;
        }

        if (valor === "=") {
          try {
            const resultado = calc.evaluar(expresion);
            pantalla.textContent = resultado;
            expresion = resultado.toString();
            nuevaOperacion = true;
          } catch {
            pantalla.textContent = "Error!";
            expresion = "";
          }
          return;
        }

        if (valor.match(/[0-9+\-*/.]/)) {
          if (nuevaOperacion && valor.match(/[0-9]/)) {
            expresion = valor; // empezar nueva operación si se presiona un número
            nuevaOperacion = false;
          } else {
            expresion += valor;
          }
          pantalla.textContent = expresion;
        }
      });
    });
  </script>
</body>
</html>
